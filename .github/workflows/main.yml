name: Run JMeter Test and Push CSV

on:
  push:
    paths:
      - '**.jmx'
  workflow_dispatch:

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run JMeter Test
      uses: rbhadti94/apache-jmeter-action@v0.7.0
      with:
        testFilePath: FetchNames.jmx
        outputReportsFolder: reports/

    - name: Archive JMeter result.jtl
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-jtl-results
        path: reports/result.jtl

    - name: Archive output.csv
      uses: actions/upload-artifact@v4
      with:
        name: movie-output
        path: output.csv

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install --upgrade google-api-python-client google-auth

    - name: Write Google credentials file
      run: echo "${{ secrets.GOOGLE_SHEET_CREDS_JSON }}" > service-account.json

    - name: Push output.csv to Google Sheet
      run: |
        python <<EOF
        import csv
        from google.oauth2.service_account import Credentials
        from googleapiclient.discovery import build

        CSV_FILE = 'output.csv'
        SERVICE_ACCOUNT_FILE = 'service-account.json'
        SPREADSHEET_ID = 'your_spreadsheet_id_here'
        SHEET_NAME = 'Sheet1'

        creds = Credentials.from_service_account_file(SERVICE_ACCOUNT_FILE, scopes=["https://www.googleapis.com/auth/spreadsheets"])
        service = build('sheets', 'v4', credentials=creds)

        with open(CSV_FILE, newline='') as f:
            reader = csv.reader(f)
            values = list(reader)

        # Optional: clear old data
        service.spreadsheets().values().clear(
            spreadsheetId=SPREADSHEET_ID,
            range=f'{SHEET_NAME}!A1:Z1000'
        ).execute()

        body = { 'values': values }
        result = service.spreadsheets().values().update(
            spreadsheetId=SPREADSHEET_ID,
            range=f'{SHEET_NAME}!A1',
            valueInputOption='RAW',
            body=body
        ).execute()

        print(f"{result.get('updatedCells')} cells updated in Google Sheet.")
        EOF
