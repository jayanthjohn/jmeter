name: Run JMeter Test and Push CSV to Google Sheet

on:
  push:
    paths:
      - '**.jmx'
  workflow_dispatch:

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run JMeter Test
      uses: rbhadti94/apache-jmeter-action@v0.7.0
      with:
        testFilePath: FetchNames.jmx
        outputReportsFolder: reports/

    - name: Archive JMeter result.jtl
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-jtl-results
        path: reports/result.jtl

    - name: Archive output.csv
      uses: actions/upload-artifact@v4
      with:
        name: movie-output
        path: output.csv

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install --upgrade google-api-python-client google-auth

    - name: Write Google credentials file
      run: |
        cat <<EOF > service-account.json
        ${{ secrets.GOOGLE_SHEET_CREDS_JSON }}
        EOF

    - name: Push output.csv to Google Sheet
      run: python update_sheet.py ${{ secrets.GOOGLE_SHEET_ID }}
