name: Debug JMeter Execution and Push to Google Sheet

on:
  push:
    paths:
      - '**.jmx'
  workflow_dispatch:

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: List all repo contents
      run: ls -R

    - name: Check FetchNames.jmx existence
      run: |
        if [ ! -f FetchNames.jmx ]; then
          echo "ERROR: FetchNames.jmx not found in root of repo"
          exit 1
        fi

    - name: Run JMeter Test
      uses: rbhadti94/apache-jmeter-action@v0.7.0
      with:
        testFilePath: FetchNames.jmx
        outputReportsFolder: reports/
        outputFile: reports/result.jtl

    - name: Archive HTML Reports
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-html-reports
        path: reports/

    - name: List contents of reports folder
      run: |
        echo "Reports directory contents:"
        ls -la reports || echo "Reports folder not found"

    - name: View result.jtl content
      run: |
        if [ -f reports/result.jtl ]; then
          echo "Dumping result.jtl:"
          cat reports/result.jtl
        else
          echo "result.jtl not found"
        fi

    - name: Archive output.csv if exists
      uses: actions/upload-artifact@v4
      with:
        name: output-csv
        path: output.csv

    - name: Setup Python for Google Sheets
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install --upgrade google-api-python-client google-auth

    - name: Write Google credentials file
      run: |
        cat <<EOF > service-account.json
        ${{ secrets.GOOGLE_SHEET_CREDS_JSON }}
        EOF

    - name: Push output.csv to Google Sheet
      run: python update_sheet.py ${{ secrets.GOOGLE_SHEET_ID }}
