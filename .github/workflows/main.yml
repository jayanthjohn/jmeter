name: Run JMeter Test and Export Output

on:
  push:
    paths:
      - '**.jmx'
  workflow_dispatch:

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Run JMeter script
      uses: justb4/jmeter-action@v2.1.1
      with:
        jmx_file: FetchNames.jmx

    - name: Archive JMeter result.jtl
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-jtl-results
        path: result.jtl

    - name: Archive output.csv
      uses: actions/upload-artifact@v4
      with:
        name: movie-output
        path: output.csv
